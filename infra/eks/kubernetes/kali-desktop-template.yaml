apiVersion: apps/v1
kind: Deployment
metadata:
  name: kali-desktop-template
  namespace: omnikali-desktop
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kali-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kali-desktop
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: desktop
          image: REPLACE_WITH_ECR_KALI_DESKTOP_IMAGE
          ports:
            - name: http
              containerPort: 6080
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /home/kali
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: USER_WORKSPACE_PVC
---
apiVersion: v1
kind: Service
metadata:
  name: kali-desktop-template
  namespace: omnikali-desktop
spec:
  selector:
    app.kubernetes.io/name: kali-desktop
  ports:
    - name: http
      port: 6080
      targetPort: http
