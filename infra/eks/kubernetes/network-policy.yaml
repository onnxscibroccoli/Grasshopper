apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kali-desktop-default-deny
  namespace: omnikali-desktop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kali-desktop-web-egress
  namespace: omnikali-desktop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kali-desktop
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
