# TEMPLATE ONLY (NOT DEPLOYED). Review against real OCI host nginx layout.
# Preserve existing host port 80 and RustDesk service ports.
# Requires an IP SAN cert at the referenced paths; see adjacent recovery docs.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 129.213.28.18;
    ssl_certificate /etc/letsencrypt/live/129.213.28.18/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129.213.28.18/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Route only through password-protected Kali gateway; NOT VNC directly.
    location / {
        proxy_pass http://10.42.1.26:6082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
