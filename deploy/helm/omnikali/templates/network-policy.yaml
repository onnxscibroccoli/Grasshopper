apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kali-desktop-default-deny
  namespace: {{ .Values.desktop.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kali-desktop-egress
  namespace: {{ .Values.desktop.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kali-desktop
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
