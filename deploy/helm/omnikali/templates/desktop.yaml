apiVersion: apps/v1
kind: Deployment
metadata:
  name: kali-desktop
  namespace: {{ .Values.desktop.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kali-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kali-desktop
    spec:
      automountServiceAccountToken: {{ .Values.security.serviceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: desktop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: novnc
              containerPort: 6080
          resources:
            requests:
              cpu: {{ .Values.desktop.cpu | quote }}
              memory: {{ .Values.desktop.memory }}
            limits:
              cpu: {{ .Values.desktop.cpuLimit | quote }}
              memory: {{ .Values.desktop.memoryLimit }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /home/kali
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: kali-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: kali-desktop
  namespace: {{ .Values.desktop.namespace }}
spec:
  selector:
    app.kubernetes.io/name: kali-desktop
  ports:
    - name: novnc
      port: {{ .Values.desktop.servicePort }}
      targetPort: novnc
