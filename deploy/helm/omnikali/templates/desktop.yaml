apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kali-desktop
  namespace: {{ .Values.desktop.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-kali-desktop
    omnikali.io/user: {{ .Release.Name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-kali-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-kali-desktop
        omnikali.io/user: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: {{ .Values.security.serviceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: desktop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.desktop.vncSecret }}
          ports:
            - name: novnc
              containerPort: 6080
          startupProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.desktop.cpu | quote }}
              memory: {{ .Values.desktop.memory }}
            limits:
              cpu: {{ .Values.desktop.cpuLimit | quote }}
              memory: {{ .Values.desktop.memoryLimit }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /home/kali
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kali-desktop
  namespace: {{ .Values.desktop.namespace }}
  labels:
    omnikali.io/user: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.desktop.serviceType }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-kali-desktop
  ports:
    - name: novnc
      port: {{ .Values.desktop.servicePort }}
      targetPort: novnc
      nodePort: {{ .Values.desktop.nodePort }}
