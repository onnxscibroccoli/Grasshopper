<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>Android phone viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:white;font:16px system-ui;overflow:hidden}
#view{position:fixed;overflow:hidden}#screen{position:absolute;inset:0;overflow:hidden;touch-action:none}
button,summary{font:inherit;min-height:44px;padding:10px;cursor:pointer}button{border:1px solid #777;border-radius:8px;background:#303844;color:white}
#menu{position:absolute;z-index:3;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));max-width:calc(100% - 16px);width:300px;max-height:calc(100% - 16px);overflow:auto;overscroll-behavior:contain;background:#20242bf2;border:1px solid #888;border-radius:10px}
#menu>summary{position:sticky;top:0;background:#20242b;list-style:none}#menu:not([open]){width:auto}
#controls{padding:8px;display:grid;gap:8px}.row{display:flex;flex-wrap:wrap;gap:6px}p{font-size:14px;margin:4px 0}
#native-input{position:absolute;bottom:0;left:0;width:1px;height:1px;opacity:.01;padding:0;border:0;font-size:16px;pointer-events:none}
@media(pointer:coarse){html,body{font-size:clamp(16px,4vw,40px)}button,summary{min-height:2.75rem;padding:.6rem}#menu{width:20rem}p{font-size:.875rem}}
</style></head><body><main id="view">
<section id="screen" aria-label="Remote Android screen"></section>
<textarea id="native-input" aria-label="Remote keyboard input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
<details id="menu"><summary>Controls</summary><div id="controls">
<p id="status" role="status">Connecting…</p>
<button id="keyboard" disabled>Phone keyboard</button>
<div class="row"><button id="fit">Fit screen</button><button id="reconnect">Reconnect</button><button id="fullscreen">Fullscreen</button></div>
<div class="row"><button data-key="65307">Escape</button><button data-key="65288">Backspace</button><button data-key="65289">Tab</button><button data-key="65293">Enter</button></div>
<button id="close">Close controls</button><p id="notice" role="status">Tap the remote field, then Phone keyboard. Typing goes directly to the remote field.</p>
</div></details></main><script type="module" src="./phone.mjs?v=3"></script></body></html>
