syntax = "proto3";

package omnikali.v1;

option java_multiple_files = true;
option java_package = "com.omnikali.protocol.v1";
option java_outer_classname = "ControlProtocol";

service ControlPlane {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  string device_id = 1;
  string session_id = 2;
  uint64 sequence = 3;
  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    JobAccepted accepted = 12;
    JobResult result = 13;
    JobFailure failure = 14;
  }
}

message ServerMessage {
  uint64 sequence = 1;
  oneof payload {
    Welcome welcome = 10;
    JobCommand command = 11;
    CancelJob cancel = 12;
    ServerHeartbeat heartbeat = 13;
  }
}

message Hello {
  string app_version = 1;
  string protocol_version = 2;
  repeated string capabilities = 3;
}

message Welcome {
  string server_version = 1;
  uint32 heartbeat_interval_seconds = 2;
}

message Heartbeat {
  int64 timestamp_unix_ms = 1;
  string execution_state = 2;
}

message ServerHeartbeat {
  int64 timestamp_unix_ms = 1;
}

message JobCommand {
  string job_id = 1;
  string idempotency_key = 2;
  string operation = 3;
  bytes payload = 4;
  int64 deadline_unix_ms = 5;
  string required_scope = 6;
}

message JobAccepted {
  string job_id = 1;
  string state = 2;
}

message JobResult {
  string job_id = 1;
  string state = 2;
  bytes payload = 3;
  string sha256 = 4;
}

message JobFailure {
  string job_id = 1;
  string error_code = 2;
  string message = 3;
  bool retryable = 4;
}

message CancelJob {
  string job_id = 1;
  string reason = 2;
}
