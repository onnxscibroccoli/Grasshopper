plugins {
    id 'com.android.application'
}
android {
    namespace 'org.broccoli.remoteinputprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'org.broccoli.remoteinputprobe'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
