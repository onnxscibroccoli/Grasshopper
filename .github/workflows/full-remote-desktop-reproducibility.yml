name: Full Remote Desktop Reproducibility Contract

on:
  pull_request:
  push:
    branches: [main, full-remote-desktop-reproducibility]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:full-remote-desktop-reproducibility
      - run: node --test test/full-remote-desktop-reproducibility.test.mjs
