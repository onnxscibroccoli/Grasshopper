name: Self-hosted remote operations
on:
  pull_request:
    paths: ['tools/remote-ops/**', '.github/workflows/remote-ops.yml']
  push:
    paths: ['tools/remote-ops/**', '.github/workflows/remote-ops.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked gateway dependencies
        run: npm ci --prefix tools/remote-ops --ignore-scripts --no-audit --no-fund
      - name: Execute gateway contracts
        id: tests
        working-directory: tools/remote-ops
        run: node --test --test-reporter=junit test/*.test.mjs > results.xml
      - name: Capture revision and report digests
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          NODE_MATRIX: ${{ matrix.node }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tested = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parents = subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).split()
          candidate = os.environ['CANDIDATE_SHA']
          pr = os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          identity_ok = (len(parents)==2 and parents[1]==candidate) if pr else tested==candidate
          artifacts = {}
          for name in ['tools/remote-ops/package-lock.json','tools/remote-ops/results.xml']:
              path=Path(name)
              if path.exists(): artifacts[name]=hashlib.sha256(path.read_bytes()).hexdigest()
          data={'schema':'remote-ops-ci/v1','candidateSha':candidate,'testedSha':tested,
                'baseSha':parents[0] if pr and parents else None,'identityVerified':identity_ok,
                'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'nodeMatrix':os.environ['NODE_MATRIX'],'testOutcome':os.environ['TEST_OUTCOME'],
                'sha256':artifacts,'approvalEffective':False,'liveDeviceAcceptance':'NOT_TESTED'}
          Path('remote-ops-evidence.json').write_text(json.dumps(data,indent=2)+'\n')
          if not identity_ok: raise SystemExit('Revision identity mismatch')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-ops-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            remote-ops-evidence.json
            tools/remote-ops/results.xml
          if-no-files-found: error
          retention-days: 30
