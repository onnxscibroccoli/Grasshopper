name: Agentic Development Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      autonomous:
        description: "Allow the coding agent to create a bounded PR"
        required: true
        default: true
        type: boolean

concurrency:
  group: agentic-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: BIST schema
        run: npm run validate:bist-schema
      - name: Control-plane verification
        run: npm run verify:agentic-control-plane
      - name: Reproducibility verification
        run: npm run verify:agentic-reproducibility
      - name: Capture verification evidence
        if: always()
        run: |
          mkdir -p .ci-evidence
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$GITHUB_SHA"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
          } > .ci-evidence/run.txt
          npm test > .ci-evidence/npm-test-rerun.txt 2>&1 || true
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          path: .ci-evidence/

  agent:
    name: Autonomous bounded improvement
    needs: verify
    if: >
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'schedule' || inputs.autonomous == true) &&
      vars.ANTHROPIC_FEDERATION_RULE_ID != '' &&
      vars.ANTHROPIC_ORGANIZATION_ID != '' &&
      vars.ANTHROPIC_SERVICE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run bounded coding agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 10
            --allowedTools "Read,Glob,Grep,Edit,Replace,Bash(npm install),Bash(npm test),Bash(npm run bist),Bash(npm run validate:bist-schema),Bash(npm run verify:agentic-control-plane),Bash(npm run verify:agentic-reproducibility),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh pr list:*)"
          prompt: |
            You are the bounded Grasshopper maintenance agent operating in a recurring development loop.
            Follow AGENTS.md exactly: observe -> classify -> isolate -> repair -> test -> record -> continue.

            First inspect current source and tests, recent CI evidence and failures, all open relevant issues, open PRs, and existing workflows.

            Treat test results as evidence that determines the next test. If a test exposes a boundary or missing invariant, add the smallest regression test that captures it. If a regression test reveals a code defect, repair the defect and rerun relevant tests. If the repair reveals a missing automation capability, add bounded automation and test that automation too.

            Work one coherent improvement at a time. Prioritize the first real blocker over cosmetic work. Every behavior change should have a regression test.

            Before creating a PR, inspect open PRs and avoid duplicate work. Create a PR for a coherent change. Never merge it.

            Never deploy to AWS production, modify live Helix/Kali, touch production credentials, introduce long-lived cloud credentials, weaken verification, bypass tests, claim health from process existence, make destructive infrastructure changes, modify protected ingress, or merge directly to main.

            Run the narrowest relevant tests after each change, then npm test plus BIST/control-plane/reproducibility checks. Preserve failure cause and evidence in the PR. If there is no justified bounded improvement, make no change and report that clearly. Human remains final merge authority.

      - name: Test agent-generated changes in the same workspace
        run: |
          npm install --ignore-scripts
          npm test
          npm run validate:bist-schema
          npm run verify:agentic-control-plane
          npm run verify:agentic-reproducibility

      - name: Record agent-generated diff
        if: always()
        run: |
          mkdir -p .ci-evidence
          git status --short > .ci-evidence/agent-status.txt || true
          git diff --check > .ci-evidence/agent-diff-check.txt || true
          git diff --stat > .ci-evidence/agent-diff-stat.txt || true

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-${{ github.run_id }}
          path: .ci-evidence/

  agent-verify:
    name: Verify resulting repository state
    needs: agent
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout resulting main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts
      - name: Test resulting state
        run: npm test
      - name: Validate resulting BIST
        run: npm run validate:bist-schema
      - name: Validate resulting control plane
        run: npm run verify:agentic-control-plane
      - name: Validate resulting reproducibility
        run: npm run verify:agentic-reproducibility
