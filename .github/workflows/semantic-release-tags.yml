name: semantic-release-tags

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          git show-ref --tags --verify --quiet "refs/tags/$TAG" && { echo "tag $TAG already exists"; exit 1; } || true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify source
        run: npm test
      - name: Create immutable release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Grasshopper $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
