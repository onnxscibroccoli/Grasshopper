name: Android Controller

on:
  pull_request:
    paths:
      - "apps/android-controller/**"
      - "scripts/build-android-controller.sh"
      - "docs/ANDROID_CONTROLLER_ACCEPTANCE.md"
      - ".github/workflows/android-controller.yml"
  push:
    branches: [main]
    paths:
      - "apps/android-controller/**"
      - "scripts/build-android-controller.sh"
      - "docs/ANDROID_CONTROLLER_ACCEPTANCE.md"
      - ".github/workflows/android-controller.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test controller
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug build
        run: bash scripts/build-android-controller.sh :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK for installation tests
        uses: actions/upload-artifact@v4
        with:
          name: controller-debug-${{ github.sha }}
          path: apps/android-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Sign and publish production controller APK
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    environment: android-controller-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Require protected signing material and decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.CONTROLLER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CONTROLLER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CONTROLLER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CONTROLLER_KEY_PASSWORD }}
          EXPECTED_SIGNER: ${{ secrets.CONTROLLER_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_SIGNER"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/controller-release.jks"
          chmod 600 "$RUNNER_TEMP/controller-release.jks"
          echo "CONTROLLER_SIGNER_SHA256=$EXPECTED_SIGNER" >> "$GITHUB_ENV"
      - name: Build release APK with protected signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/controller-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CONTROLLER_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.CONTROLLER_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CONTROLLER_KEY_PASSWORD }}
        run: bash scripts/build-android-controller.sh :app:assembleRelease
      - name: Verify APK signature and signer identity
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          APK="apps/android-controller/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          cat "$RUNNER_TEMP/apksigner.txt"
          ACTUAL="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$CONTROLLER_SIGNER_SHA256" | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')"
          [[ "$EXPECTED" =~ ^[A-F0-9]{64}$ ]]
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p release-output
          cp "$APK" release-output/controller.apk
          sha256sum release-output/controller.apk > release-output/controller.apk.sha256
          {
            echo "artifact=controller.apk"
            echo "version=0.1.0"
            echo "tag=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "signer_sha256=$ACTUAL"
            echo "verification=apksigner PASS"
          } > release-output/controller-release-manifest.txt
      - name: Upload signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-output/controller.apk release-output/controller.apk.sha256 release-output/controller-release-manifest.txt --clobber
      - name: Retain verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: controller-release-${{ github.ref_name }}
          path: release-output/
          if-no-files-found: error
          retention-days: 90
