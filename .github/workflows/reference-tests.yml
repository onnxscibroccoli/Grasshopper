name: Reference tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
      - run: node --check scripts/independent-postgres-backup.mjs
      - run: node --check scripts/verify-independent-backup.mjs
      - run: node --check scripts/check-backup-retention.mjs
      - run: node --check scripts/validate-independent-backup-storage.mjs
      - run: node scripts/validate-independent-backup-storage.mjs
      - run: node --check scripts/validate-independent-backup-runner.mjs
      - run: node scripts/validate-independent-backup-runner.mjs
      - run: node --check scripts/bist.mjs
      - name: Run BIST contract
        run: node scripts/bist.mjs --skip-local --allow-dirty --out bist-report.json
      - name: Upload BIST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bist-report
          path: bist-report.json
