name: Build Broccoli Gateway Companion APK (preview)
on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-network/android-companion/**'
      - '.github/workflows/broccoli-companion-apk.yml'

permissions:
  contents: read

concurrency:
  group: broccoli-companion-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bootstrap-debug:
    name: Android API 35 debug bootstrap APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout only the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35 on hosted preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9 for AGP 8.7.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Assemble a debug-signed preview (NO private release keystore)
        working-directory: worker-network/android-companion
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify package signature and calculate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          apk="worker-network/android-companion/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdkmanager --list_installed | grep -E 'build-tools;35.0.0' | head -1
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate SHA-256 digest'
          sha256sum "$apk"
          echo "Unsigned release key: NONE (CI transient debug signer)"
          echo "APK package ID org.broccoli.companion.gateway.bootstrap"
          echo "FCM DISABLED; HTTPS GATEWAY NOT DEPLOYED"
      - name: Upload installable debug APK (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: broccoli-gateway-bootstrap-apk-${{ github.run_number }}
          path: worker-network/android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Display installing instructions
        run: |
          echo "### Broccoli Gateway bootstrap APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **broccoli-gateway-bootstrap-apk** artifact from this job's page, unzip it and install **app-debug.apk** on Android." >> "$GITHUB_STEP_SUMMARY"
          echo "Preview package suffix **.bootstrap** prevents collision with your future personally signed release." >> "$GITHUB_STEP_SUMMARY"
          echo "This preview pairs only after a verified public HTTPS gateway is available; Firebase push is not included." >> "$GITHUB_STEP_SUMMARY"
