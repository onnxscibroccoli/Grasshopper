name: Ollama CI failure canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-budget:
    name: Plan 200%-500% expected job runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      budgets: ${{ steps.plan.outputs.budgets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          persist-credentials: false
          fetch-depth: 1
      - id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/agentic-ci/timeout_budget.py \
            --config config/agentic-ci-time-budgets.json \
            --workflow ollama-ci-failure-canary.yml
  emit-controlled-failure:
    needs: timeout-budget
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs['timeout-budget'].outputs.budgets)['emit-controlled-failure'] }}
    steps:
      - name: Emit a single intentional failing test for observer proof
        shell: bash
        run: |
          echo "CANARY_FAILURE_CLASS=simulated_transient_ci"
          echo "ORIGINAL_RESULT=MUST_REMAIN_FAILED"
          exit 27
