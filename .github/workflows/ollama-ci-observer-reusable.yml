name: Reusable read-only Ollama CI failure observer

on:
  workflow_call:
    inputs:
      failed_run_id:
        required: true
        type: number
      failed_conclusion:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Classify workflow failure without mutating caller
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        env:
          OLLAMA_HOST: "0.0.0.0:11434"
          OLLAMA_NUM_PARALLEL: "1"
        options: >-
          --memory=4g
          --cpus=2
    steps:
      - name: Checkout trusted central main (never the triggering PR)
        uses: actions/checkout@v4
        with:
          repository: onnxscibroccoli/Grasshopper
          ref: main
          path: .ci-harness
          persist-credentials: false
          fetch-depth: 1
      - name: Wait for local container
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Fetch local Ollama model
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 1500 \
            -H 'Content-Type: application/json' \
            --data '{"name":"llama3.2:3b","stream":false}' \
            http://127.0.0.1:11434/api/pull >/dev/null
      - name: Inspect bounded failure data using read-only repository API
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_CONCLUSION: ${{ inputs.failed_conclusion }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/ci-coded"
          python3 .ci-harness/scripts/agentic-ci/workflow_run_diagnose.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$FAILED_RUN_ID" \
            --conclusion "$FAILED_CONCLUSION" \
            --output "$RUNNER_TEMP/ci-coded/summary.json"
      - name: Publish only controlled result codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-ci-failure-codes
          path: ${{ runner.temp }}/ci-coded/summary.json
          retention-days: 1
          if-no-files-found: warn
      - name: State acceptance boundaries
        if: always()
        run: |
          {
            echo "### Ollama diagnosis"
            echo "Read-only upstream failure analysis; no model commands executed."
            echo "Original failed workflow remains failed."
            echo "No secrets, raw logs, model prose, or source patches published."
          } >> "$GITHUB_STEP_SUMMARY"
