name: Agentic K3s deployment trigger

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-k3s-acceptance:
    if: startsWith(github.event.issue.title, '[agentic-deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current K3s acceptance workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: full-remote-desktop-reproducibility
        run: |
          gh workflow run k3s-live-desktop.yml --repo "$GH_REPO" --ref "$TARGET_REF"
          echo "Dispatched k3s-live-desktop.yml on $TARGET_REF"
