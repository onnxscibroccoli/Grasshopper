name: Worker catalog tests (public standard runners)

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker-network/**'
      - '.github/workflows/worker-network-tests.yml'
  pull_request:
    paths:
      - 'worker-network/**'
      - '.github/workflows/worker-network-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline zero-billable tests
        run: python -m unittest discover -s worker-network/tests -v
      - name: Validate catalog and read-only provider plan
        run: python worker-network/workerctl.py plan --providers all
