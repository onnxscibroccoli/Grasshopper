name: K3s live desktop acceptance

on:
  push:
    branches:
      - full-remote-desktop-reproducibility
    paths:
      - containers/kali-desktop/**
      - deploy/helm/**
      - .github/workflows/k3s-live-desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-k3s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install K3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Build Kali desktop image
        run: |
          docker build -t omnikali/kali-desktop:acceptance containers/kali-desktop
          docker save omnikali/kali-desktop:acceptance | sudo k3s ctr images import -

      - name: Deploy two isolated desktops from portable Helm chart
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          export VNC_PASSWORD=""
          for u in user-a user-b; do
            NS="omnikali-${u}"
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=baseline --overwrite
            kubectl -n "$NS" create secret generic desktop-secret \
              --from-literal=VNC_PASSWORD="$VNC_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
            helm upgrade --install "desktop-${u}" deploy/helm/omnikali \
              --namespace "$NS" --create-namespace \
              --set desktop.namespace="$NS" \
              --set desktop.storageClass=local-path \
              --set persistence.accessMode=ReadWriteOnce \
              --set image.repository=omnikali/kali-desktop \
              --set image.tag=acceptance \
              --set image.pullPolicy=Never \
              --set persistence.enabled=true \
              --set desktop.cpu=750m \
              --set desktop.memory=1536Mi \
              --set desktop.cpuLimit=1500m \
              --set desktop.memoryLimit=3Gi
          done
          helm list --all-namespaces
          kubectl get pods -A -o wide
          if ! kubectl -n omnikali-user-a rollout status deployment/kali-desktop --timeout=180s; then
            kubectl -n omnikali-user-a get pods -o wide
            kubectl -n omnikali-user-a describe pods
            kubectl -n omnikali-user-a logs deployment/kali-desktop --all-containers=true --tail=200 || true
            exit 1
          fi
          if ! kubectl -n omnikali-user-b rollout status deployment/kali-desktop --timeout=180s; then
            kubectl -n omnikali-user-b get pods -o wide
            kubectl -n omnikali-user-b describe pods
            kubectl -n omnikali-user-b logs deployment/kali-desktop --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Verify desktop isolation and recovery
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          A=$(kubectl -n omnikali-user-a get pod -l app.kubernetes.io/name=kali-desktop -o jsonpath='{.items[0].metadata.name}')
          B=$(kubectl -n omnikali-user-b get pod -l app.kubernetes.io/name=kali-desktop -o jsonpath='{.items[0].metadata.name}')
          test "$A" != "$B"

          kubectl -n omnikali-user-a delete job marker-write --ignore-not-found=true --wait=true
          kubectl -n omnikali-user-a apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: marker-write
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: busybox:1.36
                    command: ["sh", "-c", "printf 'USER_A_MARKER\\n' > /workspace/isolation.txt"]
                    volumeMounts:
                      - name: workspace
                        mountPath: /workspace
                volumes:
                  - name: workspace
                    persistentVolumeClaim:
                      claimName: kali-workspace
          YAML
          kubectl -n omnikali-user-a wait --for=condition=complete job/marker-write --timeout=180s
          kubectl -n omnikali-user-a delete job marker-write --wait=true

          kubectl -n omnikali-user-b delete job isolation-check --ignore-not-found=true --wait=true
          kubectl -n omnikali-user-b apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: isolation-check
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: busybox:1.36
                    command: ["sh", "-c", "test ! -f /workspace/isolation.txt"]
                    volumeMounts:
                      - name: workspace
                        mountPath: /workspace
                        readOnly: true
                volumes:
                  - name: workspace
                    persistentVolumeClaim:
                      claimName: kali-workspace
          YAML
          kubectl -n omnikali-user-b wait --for=condition=complete job/isolation-check --timeout=180s
          kubectl -n omnikali-user-b delete job isolation-check --wait=true

          kubectl -n omnikali-user-a delete pod "$A" --wait=true
          kubectl -n omnikali-user-a rollout status deployment/kali-desktop --timeout=180s
          A2=$(kubectl -n omnikali-user-a get pods -l app.kubernetes.io/name=kali-desktop --no-headers -o custom-columns=NAME:.metadata.name,CREATED:.metadata.creationTimestamp | sort -k2 | tail -1 | awk '{print $1}')
          test "$A2" != "$A"
          kubectl -n omnikali-user-a wait --for=condition=Ready "pod/$A2" --timeout=180s

          kubectl -n omnikali-user-a delete job recovery-check --ignore-not-found=true --wait=true
          kubectl -n omnikali-user-a apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: recovery-check
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: busybox:1.36
                    command: ["sh", "-c", "test \"$(cat /workspace/isolation.txt)\" = USER_A_MARKER"]
                    volumeMounts:
                      - name: workspace
                        mountPath: /workspace
                        readOnly: true
                volumes:
                  - name: workspace
                    persistentVolumeClaim:
                      claimName: kali-workspace
          YAML
          kubectl -n omnikali-user-a wait --for=condition=complete job/recovery-check --timeout=180s
          kubectl -n omnikali-user-a delete job recovery-check --wait=true
          echo "K3S Helm deployment, multi-user isolation and persistent workspace recovery: PASS"

      - name: Publish live noVNC tunnel
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          nohup kubectl -n omnikali-user-a port-forward svc/kali-desktop 6080:6080 --address 127.0.0.1 >/tmp/port-forward.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:6080/ >/tmp/novnc.html
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\\.trycloudflare\\.com' /tmp/cloudflared.log | head -1 || true)
            test -n "$URL" && break
            sleep 2
          done
          test -n "$URL"
          echo "LIVE_NOVNC_URL=$URL" >> "$GITHUB_ENV"
          echo "## Live K3s desktop" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Authentication: none for this ephemeral demo tunnel." >> "$GITHUB_STEP_SUMMARY"
          echo "This URL is temporary and exists only while this workflow run is alive." >> "$GITHUB_STEP_SUMMARY"

          DEMO_BRANCH="live-k3s-demo"
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$DEMO_BRANCH" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$DEMO_BRANCH" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          printf '%s\\n' \
            '# Live OmniKali K3s Desktop' \
            '' \
            "Temporary acceptance endpoint for workflow run $GITHUB_RUN_ID." \
            '' \
            "**Open the desktop:** $URL" \
            '' \
            'No VNC password is required for this ephemeral acceptance endpoint.' \
            '' \
            'The endpoint is backed by a GitHub-hosted K3s runner and is destroyed when the workflow ends.' \
            > /tmp/live-k3s.md
          CONTENT_B64=$(base64 -w0 /tmp/live-k3s.md)
          FILE_ENDPOINT="repos/$GITHUB_REPOSITORY/contents/docs/live-k3s/latest.md"
          EXISTING_SHA=$(gh api "$FILE_ENDPOINT?ref=$DEMO_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api "$FILE_ENDPOINT" -X PUT -f message="ci: update live K3s demo endpoint" -f content="$CONTENT_B64" -f sha="$EXISTING_SHA" -f branch="$DEMO_BRANCH" >/dev/null
          else
            gh api "$FILE_ENDPOINT" -X PUT -f message="ci: publish live K3s demo endpoint" -f content="$CONTENT_B64" -f branch="$DEMO_BRANCH" >/dev/null
          fi
          echo "Published live endpoint to branch $DEMO_BRANCH."
          while true; do sleep 60; done
