name: security-phase-contract

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/security-phase-gates"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run security phase contract tests
        run: node --test test/security-phase-verify.test.mjs
